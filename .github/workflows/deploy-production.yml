name: Deploy Production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/api/package-lock.json
            tests/e2e/package-lock.json

      - name: Create production env file
        shell: bash
        env:
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.PROD_KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          PROD_GRAFANA_ADMIN_PASSWORD: ${{ secrets.PROD_GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          cp .env.prod.example .env.prod
          # Fallbacks academicos si los secrets no estan configurados (CI demo local).
          POSTGRES_PASSWORD="${PROD_POSTGRES_PASSWORD:-inventory_password}"
          KEYCLOAK_ADMIN_PASSWORD="${PROD_KEYCLOAK_ADMIN_PASSWORD:-admin}"
          ADMIN_CLIENT_SECRET="${KEYCLOAK_ADMIN_CLIENT_SECRET:-inventory-admin-secret-change-me}"
          GRAFANA_ADMIN_PASSWORD="${PROD_GRAFANA_ADMIN_PASSWORD:-admin}"
          {
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "DATABASE_PASSWORD=${POSTGRES_PASSWORD}"
            echo "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}"
            echo "KEYCLOAK_ADMIN_CLIENT_SECRET=${ADMIN_CLIENT_SECRET}"
            echo "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}"
          } >> .env.prod

      - name: Start production stack
        run: docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml --env-file .env.prod up -d --build

      - name: Wait for backend health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 5
          done
          docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml --env-file .env.prod logs backend --tail 120
          exit 1

      - name: Post-deploy smoke
        run: bash scripts/post-deploy-smoke.sh

      - name: API Newman
        working-directory: tests/api
        run: |
          npm ci
          npm test -- --env-var "baseUrl=http://localhost:8080" --env-var "keycloakUrl=http://localhost:8081" --env-var "sku=PROD-${{ github.run_number }}"

      - name: API Schemathesis
        run: |
          chmod +x scripts/run-schemathesis.sh
          SCHEMATHESIS_BASE_URL=http://localhost:8080 ./scripts/run-schemathesis.sh

      - name: Restore catalog after API fuzz
        run: |
          set -euo pipefail
          # Schemathesis puede soft-deletear productos del seed; reactivar para E2E UI.
          docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml --env-file .env.prod \
            exec -T postgres psql -U inventory_user -d inventory \
            -c "UPDATE products SET status = 'ACTIVE' WHERE status <> 'ACTIVE';"

      - name: Wait for frontend and Keycloak login
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ >/dev/null \
              && curl -sf http://localhost:8081/realms/inventory-realm/.well-known/openid-configuration >/dev/null; then
              echo "Frontend + Keycloak ready"
              exit 0
            fi
            echo "Waiting for frontend/Keycloak... ($i/60)"
            sleep 5
          done
          docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml --env-file .env.prod logs frontend keycloak --tail 100
          exit 1

      - name: Playwright E2E
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:3000 npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Auth smoke
        shell: pwsh
        run: ./tests/security/auth-smoke.ps1

      - name: Compose logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml --env-file .env.prod logs --no-color --tail=200 backend frontend keycloak

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml --env-file .env.prod down -v
