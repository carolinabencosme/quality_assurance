# Staging / preview — Plan v3.0 Fase 6 (QA-8)
# Uso completo (app + observabilidad + CI tooling):
#   docker compose -f docker-compose.dev.yml -f docker-compose.observability.yml -f docker-compose.staging.yml up -d --build
#
# Puertos extra: SonarQube 9000, Jenkins 8082

services:
  sonarqube:
    image: sonarqube:26.7.0.124771-community
    container_name: inventory-sonarqube-staging
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      # 9000 a menudo ocupado en Windows (emuladores). Default academico: 9001.
      - "${SONAR_PORT:-9001}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - inventory-net

  jenkins:
    image: jenkins/jenkins:2.492.2-lts-jdk21
    container_name: inventory-jenkins-staging
    restart: unless-stopped
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - inventory-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.staging
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8080}
        KEYCLOAK_PROXY_TARGET: ${KEYCLOAK_PROXY_TARGET:-http://keycloak:8080}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-inventory-realm}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-inventory-frontend}
        NEXT_PUBLIC_KEYCLOAK_API_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_API_CLIENT_ID:-inventory-api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://backend:8080
      KEYCLOAK_PROXY_TARGET: http://keycloak:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sonarqube_data:
  sonarqube_extensions:
  jenkins_home:
