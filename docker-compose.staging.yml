# Staging / preview — Plan v3.0 Fase 6 (QA-8)
# Uso completo (app + observabilidad + CI tooling):
#   docker compose -f docker-compose.dev.yml -f docker-compose.observability.yml -f docker-compose.staging.yml up -d --build
#
# Puertos extra: SonarQube 9001, Jenkins 8082
# Sonar usa PostgreSQL dedicado (no H2 embebido) para demo profesional.

services:
  sonar-db:
    image: postgres:16-alpine
    container_name: inventory-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_JDBC_USERNAME:-sonar}
      POSTGRES_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_JDBC_DATABASE:-sonar}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_JDBC_USERNAME:-sonar} -d ${SONAR_JDBC_DATABASE:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory-net

  sonarqube:
    image: sonarqube:26.7.0.124771-community
    container_name: inventory-sonarqube-staging
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_JDBC_DATABASE:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonar}
    ports:
      # 9000 a menudo ocupado en Windows (emuladores). Default academico: 9001.
      - "${SONAR_PORT:-9001}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - inventory-net

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: cub-jenkins:local
    container_name: inventory-jenkins-staging
    restart: unless-stopped
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dcasc.jenkins.config=/var/jenkins_casc
        -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Repo montado para Jenkinsfile.demo + evidencias (job seed en init.groovy)
      - ./:/workspace/cub:ro
      - ./jenkins/casc:/var/jenkins_casc:ro
    networks:
      - inventory-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.staging
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8080}
        KEYCLOAK_PROXY_TARGET: ${KEYCLOAK_PROXY_TARGET:-http://keycloak:8080}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-inventory-realm}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-inventory-frontend}
        NEXT_PUBLIC_KEYCLOAK_API_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_API_CLIENT_ID:-inventory-api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://backend:8080
      KEYCLOAK_PROXY_TARGET: http://keycloak:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  jenkins_home:
