jenkins:
  systemMessage: |
    Cub Inventory QAS — Jenkins local (Proyecto Final V3).
    Job principal: cub-inventory-qas (pipeline visual del PDF + smoke del stack).
    Pipeline CI completo del repo: Jenkinsfile (Maven/Node/Docker agents).
  numExecutors: 2
  mode: NORMAL
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true

unclassified:
  location:
    url: http://localhost:8082/
