# Render Blueprint — Cub cloud (API + Keycloak + Postgres)
# Dashboard → New → Blueprint → repo quality_assurance → rama presentacion
#
# URLs (nombres de servicio fijos):
#   https://cub-keycloak.onrender.com
#   https://cub-api.onrender.com
# Frontends:
#   https://cub-inventory-qas.vercel.app
#   https://cub-inventory-qas-prod.vercel.app

databases:
  - name: cub-inventory-db
    plan: free
    databaseName: inventory
    user: inventory

services:
  - type: web
    name: cub-keycloak
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./keycloak/Dockerfile.cloud
    dockerContext: ./keycloak
    # Healthcheck liviano: el puerto correcto es $PORT (entrypoint). Evitar /realms/... en el primer boot.
    healthCheckPath: /
    envVars:
      - key: KC_HOSTNAME
        value: https://cub-keycloak.onrender.com
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: admin
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        value: admin
      - key: JAVA_OPTS_APPEND
        # No usar UseSerialGC: choca con el GC de Keycloak/Render
        value: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=128m"
      # Postgres persistente: arranques siguientes mucho mas rapidos que H2 efimero
      - key: KC_DB
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: cub-inventory-db
          property: connectionString
      - key: KC_DB_USERNAME
        fromDatabase:
          name: cub-inventory-db
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: cub-inventory-db
          property: password

  - type: web
    name: cub-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile.cloud
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx400m"
      # Render asigna PORT; el entrypoint lo mapea a SERVER_PORT
      - key: DATABASE_URL
        fromDatabase:
          name: cub-inventory-db
          property: connectionString
      - key: KEYCLOAK_PUBLIC_URL
        value: https://cub-keycloak.onrender.com
      - key: KEYCLOAK_ISSUER_URI
        value: https://cub-keycloak.onrender.com/realms/inventory-realm
      - key: KEYCLOAK_JWKS_URI
        value: https://cub-keycloak.onrender.com/realms/inventory-realm/protocol/openid-connect/certs
      - key: KEYCLOAK_ADMIN_URL
        value: https://cub-keycloak.onrender.com
      - key: KEYCLOAK_REALM
        value: inventory-realm
      - key: KEYCLOAK_ADMIN_CLIENT_ID
        value: inventory-admin-api
      - key: KEYCLOAK_ADMIN_CLIENT_SECRET
        value: inventory-admin-secret-change-me
      - key: INVENTORY_CORS_ORIGINS
        value: https://cub-inventory-qas.vercel.app,https://cub-inventory-qas-prod.vercel.app,https://*.vercel.app
